spring.application.name=Be-ProjectTrain

# Server Port from .env
server.port=${PORT:8080}

# MongoDB Configuration from .env
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${DB_NAME:TrainAppFlutter}

# Enable Mongo auto index creation (for @Indexed(unique = true))
spring.data.mongodb.auto-index-creation=true

# Logging
logging.level.root=INFO
logging.level.com.projecttrain=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
